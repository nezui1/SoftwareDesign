name: Scheduler quality

on:
  push:
    branches: [main, lab5]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message
        if: github.event_name == 'push' && github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git log -1 --format=%s | grep -Eq '^(feat|fix|docs|test|chore|refactor|ci)(\([a-z0-9_-]+\))?: .{3,}$'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: scheduler_lab
        run: python -m pip install -e '.[dev]'
      - name: Lint
        working-directory: scheduler_lab
        run: |
          set -o pipefail
          python -m ruff check . | tee lint.txt
      - name: Test and coverage
        working-directory: scheduler_lab
        run: |
          set -o pipefail
          python -m pytest --junitxml=junit.xml --cov=scheduler --cov-branch --cov-report=xml --cov-report=term | tee test-output.txt
      - name: Record metrics
        working-directory: scheduler_lab
        run: python scripts/metrics.py > metrics.json
      - name: Save quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            scheduler_lab/lint.txt
            scheduler_lab/test-output.txt
            scheduler_lab/junit.xml
            scheduler_lab/coverage.xml
            scheduler_lab/metrics.json

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        working-directory: scheduler_lab
        run: |
          python -m pip install build
          python -m build
      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-package
          path: scheduler_lab/dist/
